<button
  type="button"
  class="theme-toggle"
  role="switch"
  [class.theme-toggle--dark]="theme.current() === 'dark'"
  [attr.aria-checked]="theme.current() === 'dark'"
  [attr.aria-label]="theme.current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  (click)="theme.toggle()"
>
  <span class="theme-toggle__track" aria-hidden="true">
    <span class="theme-toggle__icon theme-toggle__icon--moon">
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <path d="M20.2 15.4A8.3 8.3 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path>
      </svg>
    </span>
    <span class="theme-toggle__icon theme-toggle__icon--sun">
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path>
      </svg>
    </span>
    <span class="theme-toggle__knob">
      <svg class="theme-toggle__knob-icon theme-toggle__knob-icon--moon" viewBox="0 0 40 40" focusable="false" aria-hidden="true">
        <path d="M20.2 15.4A8.3 8.3 0 0 1 8.6 3.8 8.7 8.7 0 1 0 20.2 15.4Z"></path>
      </svg>
      <svg class="theme-toggle__knob-icon theme-toggle__knob-icon--sun" viewBox="0 0 40 40" focusable="false" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path>
      </svg>
    </span>
  </span>
</button>
